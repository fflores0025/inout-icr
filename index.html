<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRC — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --a1: #c8ff00;
      --a2: #ff3cac;
      --a3: #00d4ff;
      --bg: #07070f;
      --bg2: #0f0f1a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: var(--bg2);
      border: 1px solid rgba(200, 255, 0, 0.1);
      border-radius: 16px;
      padding: 48px;
      max-width: 440px;
      width: 100%;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: var(--a1);
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      font-size: 14px;
      opacity: 0.6;
      margin-bottom: 40px;
    }
    .form-group { margin-bottom: 24px; }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      opacity: 0.8;
    }
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 16px;
      color: white;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--a1);
      box-shadow: 0 0 0 3px rgba(200, 255, 0, 0.1);
    }
    input::placeholder { color: rgba(255, 255, 255, 0.3); }
    .btn {
      width: 100%;
      background: var(--a1);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(200, 255, 0, 0.3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .error {
      background: rgba(255, 60, 172, 0.1);
      border: 1px solid var(--a2);
      color: var(--a2);
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }
    .loading { display: none; text-align: center; margin-top: 16px; opacity: 0.6; font-size: 14px; }
    .loading.active { display: block; }
    .footer { text-align: center; margin-top: 32px; font-size: 12px; opacity: 0.4; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">InOut Repair Center</div>
    <div class="subtitle">Sistema de gestión de reparaciones</div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="tu@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Iniciar sesión</button>
      <div class="loading" id="loading">Verificando credenciales...</div>
      <div class="error" id="error"></div>
    </form>
    <div class="footer">InOut Media · Sistema Interno</div>
  </div>

  <!-- SDK al final del body, ANTES del script de app -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // UNA SOLA declaración aquí, después del SDK
    var supabase = window.supabase.createClient(
      'https://raoxkjnwrccoxjcipfpv.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhb3hram53cmNjb3hqY2lwZnB2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzE0MzEwNDIsImV4cCI6MjA0NzAwNzA0Mn0.sb_publishable__-K1pC4bOJHRf8JQ__OOzg_jqLxlGla'
    );

    const loginBtn = document.getElementById('loginBtn');
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');

    // Verificar sesión activa al cargar
    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) await verifyAndRedirect(session.user);
    }
    checkSession();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) { showError('Por favor completa todos los campos'); return; }

      loginBtn.disabled = true;
      loading.classList.add('active');
      errorEl.style.display = 'none';

      try {
        const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });
        if (authError) throw new Error('Email o contraseña incorrectos');
        await verifyAndRedirect(authData.user);
      } catch (err) {
        showError(err.message);
        loginBtn.disabled = false;
        loading.classList.remove('active');
      }
    });

    async function verifyAndRedirect(user) {
      try {
        let { data: empleado } = await supabase
          .from('empleados')
          .select('*')
          .eq('auth_user_id', user.id)
          .maybeSingle();

        if (!empleado) {
          const { data: byEmail } = await supabase
            .from('empleados')
            .select('*')
            .eq('email', user.email)
            .maybeSingle();

          if (!byEmail) throw new Error('Usuario no autorizado para IRC');

          await supabase.from('empleados').update({ auth_user_id: user.id }).eq('id', byEmail.id);
          empleado = byEmail;
        }

        if (!empleado.irc_rol && empleado.role !== 'superadmin') {
          await supabase.auth.signOut();
          throw new Error('No tienes acceso al sistema IRC');
        }

        localStorage.setItem('irc_user_id', empleado.id);
        localStorage.setItem('irc_user_rol', empleado.irc_rol || empleado.role);
        localStorage.setItem('irc_user_nombre', `${empleado.nombre} ${empleado.apellido || ''}`);
        localStorage.setItem('irc_user_email', user.email);

        window.location.href = empleado.irc_rol === 'almacen' ? 'almacen.html' : 'escritorio.html';

      } catch (err) {
        await supabase.auth.signOut();
        showError(err.message);
        loginBtn.disabled = false;
        loading.classList.remove('active');
      }
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      setTimeout(() => errorEl.style.display = 'none', 5000);
    }

    document.getElementById('email').focus();
  </script>
</body>
</html>
